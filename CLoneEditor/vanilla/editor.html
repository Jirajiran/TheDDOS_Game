<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map editor</title>
    <link rel="icon" href="Asset/AssetSVG/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/editor.css" />
  </head>
  <body>
    <section id="screen-loading" class="editor-loading-screen" hidden aria-label="Loading">
      <div class="loading-view loading-view--main editor-loading-view">
        <div class="bg-overlay"></div>
        <div class="loading-content">

            </svg>
          </div>
          <div class="status-info">
            <span class="tip-text" id="editor-load-label">Reading pack…</span>
            <span class="loading-status" id="editor-load-pct">Loading 0%</span>
          </div>
          <div class="loading-bar-wrapper">
            <svg class="loading-frame" viewBox="0 0 626 47" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
              <path d="M 625.80 46.90 L 625.80 0.00 L 0.00 0.00 L 0.00 46.90 L 625.80 46.90 Z M 619.80 6.00 L 619.80 40.90 L 6.00 40.90 L 6.00 6.00 L 619.80 6.00 Z" fill="#FF2F14"/>
            </svg>
            <div class="fill-track">
              <div class="fill-progress" id="editor-load-fill"></div>
            </div>
          </div>
          <p id="editor-load-error" class="editor-error"></p>
        </div>
      </div>
    </section>

    <section id="screen-create" class="editor-screen" hidden>
      <form class="editor-card editor-create-card" id="editor-create-form">
        <h1>New map</h1>
        <p class="editor-note">The path grid is locked after this step. Each side is 1 to 8.</p>
        <p class="editor-note editor-drop-hint">
          Drop a map JSON here to Import, or use the Import button.
        </p>
        <label>
          File name
          <input id="editor-name" value="untitled_map" />
        </label>
        <label>
          Columns
          <input id="editor-cols" type="number" min="1" max="8" value="3" />
        </label>
        <label>
          Rows
          <input id="editor-rows" type="number" min="1" max="8" value="3" />
        </label>
        <div class="editor-create-actions">
          <button id="editor-create" type="submit">Create</button>
          <label class="editor-import-label editor-create-import">
            Import
            <input
              id="editor-create-import"
              type="file"
              accept="application/json,.json"
            />
          </label>
        </div>
        <button id="editor-resume-draft" type="button" hidden>
          Resume draft
        </button>
        <p id="editor-resume-hint" class="editor-note" hidden></p>
        <p id="editor-create-error" class="editor-error"></p>
      </form>
    </section>

    <section id="screen-work" class="editor-work" hidden>
      <header class="editor-bar">
        <h1 id="editor-title">untitled_map</h1>
        <p id="editor-copy" class="editor-note"></p>
        <div class="editor-bar-actions">
          <button id="editor-undo" type="button" title="Undo (Ctrl+Z)" disabled>Undo</button>
          <button id="editor-redo" type="button" title="Redo (Ctrl+Y / Ctrl+Shift+Z)" disabled>Redo</button>
          <button id="editor-new" type="button">New map</button>
          <label class="editor-import-label">
            Import
            <input id="editor-import" type="file" accept="application/json,.json" />
          </label>
          <button id="editor-export" type="button">Export</button>
          <button
            id="editor-test-play"
            type="button"
            title="Stub — origin game must wire Test Play"
          >
            Test Play
          </button>
        </div>
      </header>
      <div class="editor-body">
        <div class="editor-map-wrap">
          <div class="editor-map">
            <svg id="editor-svg" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
        </div>

        <aside id="editor-placed-tray" class="editor-placed-tray" aria-label="Trail" hidden>
          <p id="editor-field-help" class="editor-field-help" hidden>
            Hover a field to see what it means.
          </p>
          <div id="editor-placed-panel" class="editor-placed-panel"></div>
        </aside>

        <aside id="editor-panel-tray" class="editor-panel-tray" aria-label="Inspector panel tray">
          <button
            id="editor-panel-toggle"
            type="button"
            class="editor-tray-handle editor-panel-toggle"
            aria-expanded="true"
            aria-controls="editor-panel"
            title="Show / hide inspector panel"
          >
            <span class="handle-glyph" aria-hidden="true">›</span>
            <span class="handle-label">Panel</span>
          </button>
          <aside id="editor-panel" class="editor-panel"></aside>
        </aside>

        <div id="editor-tools-tray" class="editor-tools-tray" aria-label="Bottom tools tray">
          <button
            id="editor-tools-toggle"
            type="button"
            class="editor-tray-handle editor-tools-toggle"
            aria-expanded="true"
            aria-controls="editor-map-tools"
            title="Show / hide map tools tray"
          >
            <span class="handle-glyph" aria-hidden="true">⌄</span>
            <span class="handle-label">Tools</span>
          </button>
          <div id="editor-map-tools" class="editor-map-tools">
            <div id="tool-slot-obj" class="tool-slot">
              <button
                id="tool-obj-preview"
                type="button"
                class="tool-slot-preview"
                title="Place Object (Block / Turret)"
                aria-label="Place Object"
              ></button>
              <div class="tool-slot-controls">
                <label class="tool-slot-row">
                  <span>Team</span>
                  <select id="tool-obj-team" aria-label="Object team"></select>
                </label>
                <div class="tool-slot-row">
                  <span>Object</span>
                  <div id="tool-obj-picker" class="tool-picker">
                    <button id="tool-obj-picker-btn" type="button" class="tool-picker-btn" aria-haspopup="listbox" aria-expanded="false">—</button>
                    <div id="tool-obj-menu" class="tool-picker-menu" role="listbox" hidden></div>
                  </div>
                </div>
              </div>
            </div>

            <div id="tool-slot-unit" class="tool-slot">
              <button
                id="tool-unit-preview"
                type="button"
                class="tool-slot-preview"
                title="Place Unit"
                aria-label="Place Unit"
              ></button>
              <div class="tool-slot-controls">
                <label class="tool-slot-row">
                  <span>Team</span>
                  <select id="tool-unit-team" aria-label="Unit team"></select>
                </label>
                <div class="tool-slot-row">
                  <span>Unit</span>
                  <div id="tool-unit-picker" class="tool-picker">
                    <button id="tool-unit-picker-btn" type="button" class="tool-picker-btn" aria-haspopup="listbox" aria-expanded="false">—</button>
                    <div id="tool-unit-menu" class="tool-picker-menu" role="listbox" hidden></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="tool-group">
              <button id="tool-mode-area" type="button" class="tool-btn is-active" title="Draw, move, and resize areas">Area Tool</button>
              <button id="tool-mode-select" type="button" class="tool-btn" title="Select, inspect, and move placed instances or areas">Select / Move</button>
            </div>
            <div class="tool-camera-group">
              <button id="tool-zoom-out" type="button" class="tool-btn is-compact" title="Zoom out (-)">−</button>
              <button id="tool-zoom-reset" type="button" class="tool-btn is-compact" title="Reset camera to fit map (0)">100%</button>
              <button id="tool-zoom-in" type="button" class="tool-btn is-compact" title="Zoom in (+)">+</button>
            </div>
            <span id="tool-grid-readout" class="tool-grid-meta">Grid 64×64 · X: — · Y: —</span>
          </div>
        </div>
      </div>
    </section>
    <div id="editor-notice" class="editor-notice" hidden>
      <div class="editor-card">
        <p id="editor-notice-text"></p>
        <button id="editor-notice-ok" type="button">Clear</button>
        <button id="editor-notice-cancel" type="button">Cancel</button>
      </div>
    </div>
    <!-- Centered Damage & Armor Matrix Modal -->
    <div id="editor-matrix-modal" class="editor-matrix-modal-backdrop" hidden>
      <div class="editor-matrix-modal-dialog">
        <header class="editor-matrix-modal-header">
          <h2>Damage &amp; Armor Multiplier Matrix</h2>
          <button id="editor-matrix-close" class="editor-matrix-modal-close" type="button">&times;</button>
        </header>
        <div id="editor-matrix-body" class="editor-matrix-modal-body"></div>
        <footer class="editor-matrix-modal-footer">
          <button id="editor-matrix-done" type="button">Close &amp; Apply</button>
        </footer>
      </div>
    </div>
    <script type="module" src="js/editor/main.js"></script>
  </body>
</html>
