<script>
(function() {
	var origGetContext = HTMLCanvasElement.prototype.getContext;
	HTMLCanvasElement.prototype.getContext = function(type, attrs) {
		if (type === "2d") {
			attrs = attrs ? Object.assign({ willReadFrequently: true }, attrs) : { willReadFrequently: true };
		}
		return origGetContext.call(this, type, attrs);
	};
})();
</script>
<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>

<script>
var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;
function init() {
	canvas = document.getElementById("canvas");
	anim_container = document.getElementById("animation_container");
	dom_overlay_container = document.getElementById("dom_overlay_container");
	if (window.AdobeAn) AdobeAn.makeResponsive = function () {};
	var comp=AdobeAn.getComposition("9ABDDA99C9EE9E48A87522F4E82DD46C");
	var lib=comp.getLibrary();
	handleComplete({},comp);
}
function handleComplete(evt,comp) {
	var lib=comp.getLibrary();
	var ss=comp.getSpriteSheet();
	exportRoot = new lib.Editor();
	stage = new lib.Stage(canvas);
	stage.enableMouseOver();	
	fnStartAnimation = function() {
		stage.addChild(exportRoot);
		createjs.Ticker.framerate = lib.properties.fps;
		createjs.Ticker.addEventListener("tick", stage);
	}
	if (window.AdobeAn) AdobeAn.makeResponsive = function () {};
	if (window.EditorBridge && typeof window.EditorBridge.initGlobal === "function") {
		window.EditorBridge.initGlobal(exportRoot);
	}
	AdobeAn.compositionLoaded(lib.properties.id);
	fnStartAnimation();
}
</script>
</head>
<body onload="init();">
	<div id="animation_container">
		<canvas id="canvas" width="1280" height="720"></canvas>
		<div id="dom_overlay_container"></div>
	</div>
</body>
