      <!-- Text Status Bar (TipText & Loading Status) -->
      <div class="status-info">
        <span class="tip-text" id="tipText">No_Step_back.You</span>
        <span class="loading-status" id="loadingStatus">Loading 0%</span>
      </div>

      <!-- Sci-Fi Style Loading Bar Container -->
      <div class="loading-bar-wrapper">
        <!-- SVG Border Frame (ArtEdge Frame) -->
        <svg class="loading-frame" viewBox="0 0 626 47" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
          <path d="M 625.80 46.90 L 625.80 0.00 L 0.00 0.00 L 0.00 46.90 L 625.80 46.90 Z M 619.80 6.00 L 619.80 40.90 L 6.00 40.90 L 6.00 6.00 L 619.80 6.00 Z" fill="#FF2F14"/>
        </svg>

        <!-- Inner Fill Progress Bar -->
        <div class="fill-track">
          <div class="fill-progress" id="fillProgress"></div>
        </div>
      </div>

    </div>
  </main>

  <!-- Resource Loading Input Controller (API script) -->
  <script>
    /**
     * ฟังก์ชันรับ Input เพื่ออัปเดตสถานะการโหลดทรัพยากร
     * @param {number} percent - ความคืบหน้าการโหลด (0 - 100)
     * @param {string} [customText] - ข้อความสถานะหรือ Tip Text (Optional)
     */
    function updateLoadingProgress(percent, customText = null) {
      const clampedPercent = Math.min(100, Math.max(0, percent));
      const fillProgress = document.getElementById('fillProgress');
      const loadingStatus = document.getElementById('loadingStatus');
      const tipText = document.getElementById('tipText');

      fillProgress.style.width = `${clampedPercent}%`;
      loadingStatus.textContent = `Loading ${Math.round(clampedPercent)}%`;

      if (customText) {
        tipText.textContent = customText;
      }
    }

    // --- ตัวอย่างการทดสอบระบบรับ Input โหลดทรัพยากร ---
    let progress = 0;
    const interval = setInterval(() => {
      progress += Math.floor(Math.random() * 8) + 2;
      if (progress >= 100) {
        updateLoadingProgress(100, "Loaded Successfully");
        clearInterval(interval);
      } else {
        updateLoadingProgress(progress);
      }
    }, 150);
  </script>
</body>
</html>
