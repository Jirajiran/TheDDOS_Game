<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Map editor</title>
    <link rel="icon" href="Asset/AssetSVG/favicon.ico" sizes="any" />
    <link rel="stylesheet" href="css/editor.css" />
  </head>
  <body>
    <section id="screen-loading" class="editor-screen" hidden>
      <div class="editor-card">
        <h1>Loading</h1>
        <p id="editor-load-label">Reading pack…</p>
        <p id="editor-load-error" class="editor-error"></p>
      </div>
    </section>

    <section id="screen-create" class="editor-screen" hidden>
      <form class="editor-card" id="editor-create-form">
        <h1>New map</h1>
        <p class="editor-note">The path grid is locked after this step. Each side is 1 to 8.</p>
        <label>
          File name
          <input id="editor-name" value="untitled_map" />
        </label>
        <label>
          Columns
          <input id="editor-cols" type="number" min="1" max="8" value="3" />
        </label>
        <label>
          Rows
          <input id="editor-rows" type="number" min="1" max="8" value="3" />
        </label>
        <button id="editor-create" type="submit">Create</button>
        <p id="editor-create-error" class="editor-error"></p>
      </form>
    </section>

    <section id="screen-work" class="editor-work" hidden>
      <header class="editor-bar">
        <h1 id="editor-title">untitled_map</h1>
        <button id="editor-new" type="button">New map</button>
        <label>
          Import
          <input id="editor-import" type="file" accept="application/json,.json" />
        </label>
        <button id="editor-export" type="button">Export</button>
        <p id="editor-copy" class="editor-note"></p>
      </header>
      <div class="editor-body">
        <div class="editor-map-wrap">
          <div id="editor-map-tools" class="editor-map-tools">
            <div class="tool-group">
              <button id="tool-mode-area" type="button" class="tool-btn is-active" title="Draw and resize trigger/event areas">📐 Area Tool</button>
              <button id="tool-mode-place-obj" type="button" class="tool-btn" title="Place blocks, turrets, and objects on 64x64 grid">🧱 Place Object</button>
              <button id="tool-mode-place-unit" type="button" class="tool-btn" title="Place unit instances on 64x64 grid">👤 Place Unit</button>
              <button id="tool-mode-select" type="button" class="tool-btn" title="Select and inspect placed instances">✋ Select / Move</button>
            </div>
            <div id="tool-obj-select-wrap" class="tool-select-wrap" hidden>
              <label>Object: <select id="tool-obj-select"></select></label>
            </div>
            <div id="tool-unit-select-wrap" class="tool-select-wrap" hidden>
              <label>Unit: <select id="tool-unit-select"></select></label>
            </div>
            <span class="tool-grid-badge">Grid: 64×64 (L3 Snap)</span>
          </div>
          <div class="editor-map">
            <svg id="editor-svg" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
        </div>
        <aside id="editor-panel" class="editor-panel"></aside>
      </div>
    </section>
    <div id="editor-notice" class="editor-notice" hidden>
      <div class="editor-card">
        <p id="editor-notice-text"></p>
        <button id="editor-notice-ok" type="button">Clear</button>
        <button id="editor-notice-cancel" type="button">Cancel</button>
      </div>
    </div>
    <!-- Centered Damage & Armor Matrix Modal -->
    <div id="editor-matrix-modal" class="editor-matrix-modal-backdrop" hidden>
      <div class="editor-matrix-modal-dialog">
        <header class="editor-matrix-modal-header">
          <h2>Damage &amp; Armor Multiplier Matrix</h2>
          <button id="editor-matrix-close" class="editor-matrix-modal-close" type="button">&times;</button>
        </header>
        <div id="editor-matrix-body" class="editor-matrix-modal-body"></div>
        <footer class="editor-matrix-modal-footer">
          <button id="editor-matrix-done" type="button">Close &amp; Apply</button>
        </footer>
      </div>
    </div>
    <script type="module" src="js/editor/main.js"></script>
  </body>
</html>
