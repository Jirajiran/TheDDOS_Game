<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TheDDOS — Local Host</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/main.css?v=20261020a" />
  </head>
  <body>
    <div id="app">
      <!-- MENU (shown after boot preload) — MainMenu.svg + thin HTML overlays -->
      <section id="screen-menu" class="screen" hidden aria-label="Menu">
        <div id="main-menu-mount" class="main-menu-mount" aria-hidden="false"></div>
        <div class="main-menu-overlays" aria-label="Menu inputs">
          <input
            type="text"
            id="menu-name-input"
            class="menu-overlay-input menu-name-input"
            maxlength="24"
            placeholder="YOUR NAME"
            autocomplete="nickname"
          />
          <input
            type="text"
            id="menu-room-input"
            class="menu-overlay-input menu-room-input"
            maxlength="8"
            inputmode="numeric"
            placeholder="1234567"
            hidden
          />
          <input
            type="text"
            id="menu-join-input"
            class="menu-overlay-input menu-join-input"
            maxlength="32"
            placeholder="Input"
            hidden
          />
        </div>
        <!-- Legacy hooks kept for app.js / boot (hidden — SVG drives UX) -->
        <div class="menu-legacy" hidden aria-hidden="true">
          <select id="sel-mode">
            <option value="FLAT_SURVIVAL">Flat</option>
            <option value="WORLD_TYPE">World Type</option>
          </select>
          <code id="room-code">------</code>
          <button type="button" id="btn-join">Join</button>
          <p id="join-stub"></p>
          <button type="button" id="btn-start">Start</button>
          <button type="button" id="btn-restore">Restore</button>
          <button type="button" id="btn-clear-snap">Clear Snapshot</button>
          <p id="snap-status"></p>
          <div id="save-drop-zone" tabindex="-1">
            <input type="file" id="save-file-input" accept="application/json,.json" />
          </div>
          <p id="save-file-status"></p>
        </div>
      </section>

      <!-- Loading UI = HTML/CSS (SVG files = art reference only) -->
      <section id="screen-loading" class="screen is-active" aria-label="Loading">
        <div id="loading-main" class="loading-view loading-view--main" aria-label="Boot loading">
          <div class="loading-view__center">
            <h1 id="loading-main-title" class="loading-view__title">THE DDOS</h1>
            <div class="loading-bar loading-bar--menu" role="progressbar" aria-valuemin="0" aria-valuemax="100">
              <div id="loading-main-fill" class="loading-bar__fill"></div>
            </div>
          </div>
        </div>
        <div id="loading-gameplay" class="loading-view loading-view--gameplay" hidden aria-label="Match loading">
          <div class="loading-gp">
            <h1 id="loading-gp-map" class="loading-gp__map">NAMEMAP</h1>
            <div class="loading-gp__mid">
              <div class="loading-gp__left">
                <div id="loading-gp-mapicon" class="loading-gp__mapicon" aria-hidden="true"></div>
              </div>
              <div class="loading-gp__center">
                <p id="loading-gp-mode" class="loading-gp__mode">MODE:</p>
              </div>
              <div class="loading-gp__col">
                <h2 class="loading-gp__heading">Enemy Team</h2>
                <ul id="loading-gp-enemies" class="loading-gp__list"></ul>
              </div>
              <div class="loading-gp__col">
                <h2 class="loading-gp__heading">Player Team</h2>
                <ul id="loading-gp-players" class="loading-gp__list"></ul>
              </div>
            </div>
            <div class="loading-gp__bar-wrap">
              <div class="loading-bar loading-bar--gp" role="progressbar" aria-valuemin="0" aria-valuemax="100">
                <div id="loading-gp-fill" class="loading-bar__fill"></div>
              </div>
              <p id="loading-gp-ready" class="loading-gp__ready" hidden>Click or tap anywhere to start</p>
            </div>
          </div>
        </div>
        <!-- Fail-only stub (legacy ids kept for error path) -->
        <div id="loading-boot-panel" class="loading-panel" hidden>
          <h2 id="loading-title">Boot failed</h2>
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <p id="progress-label">0% — Starting…</p>
        </div>
      </section>

      <!-- PLAYING — HUD/craft/gen/end = SVG PlayerUI only -->
      <section id="screen-playing" class="screen" hidden aria-label="Playing">
        <div class="canvas-wrap">
          <canvas id="game-canvas" width="800" height="600"></canvas>
        </div>
        <div id="player-ui-mount" class="player-ui-mount" aria-hidden="false"></div>
        <div class="play-debug-tray">
          <button type="button" id="btn-cheat" class="btn btn-ghost" title="Open cheat panel">Cheat</button>
        </div>
        <div id="panel-cheat" class="game-panel" hidden aria-label="Cheat">
          <div class="game-panel-card game-panel-card--cheat">
            <header class="game-panel-head">
              <h2>Cheat</h2>
              <button type="button" id="cheat-close" class="btn btn-ghost panel-x" aria-label="Close">×</button>
            </header>
            <div class="cheat-row">
              <button type="button" id="btn-force-win" class="btn">Force Win (F9)</button>
              <button type="button" id="btn-force-lose" class="btn btn-ghost">Force Lose (F10)</button>
            </div>
            <div class="cheat-row">
              <button type="button" id="btn-free-craft" class="btn btn-ghost" title="Skip craft costs this session">FreeCraft</button>
              <button type="button" id="btn-manual-save" class="btn btn-ghost" title="Export snapshot JSON (not autosave)">Save file</button>
            </div>
            <div class="cheat-zoom">
              <label for="cheat-zoom-range">Camera zoom</label>
              <div class="cheat-zoom-controls">
                <button type="button" id="cheat-zoom-out" class="btn btn-ghost" aria-label="Zoom out">−</button>
                <input type="range" id="cheat-zoom-range" min="0.25" max="2" step="0.1" value="1" />
                <button type="button" id="cheat-zoom-in" class="btn btn-ghost" aria-label="Zoom in">+</button>
                <span id="cheat-zoom-value" class="cheat-zoom-value">1.0</span>
              </div>
              <p class="panel-hint">Scroll on slider · step 0.1 · range 0.25–2.0</p>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      /* Stage UI + soft watchdog — never overwrite Boot failed / locked title. */
      (function () {
        var label = document.getElementById('progress-label');
        var fill = document.getElementById('progress-fill');
        var title = document.getElementById('loading-title');
        if (label) label.textContent = '1% — Starting entry…';
        if (fill) fill.style.width = '1%';
        window.__theDdosPhase = window.__theDdosPhase || 'html';

        var ticks = 0;
        var timer = setInterval(function () {
          var phase = window.__theDdosPhase || '';
          if (window.__theDdos && phase === 'ready') {
            clearInterval(timer);
            return;
          }
          if (phase === 'failed' || phase === 'ready') {
            clearInterval(timer);
            return;
          }
          if (title && title.dataset.locked === '1') {
            clearInterval(timer);
            return;
          }
          ticks += 1;
          /* Still importing heavy graph — show phase, do not hard-fail yet. */
          if (phase === 'import-app' || phase === 'create-app' || phase === 'boot') {
            if (label && ticks % 2 === 0) {
              label.textContent =
                (label.textContent.split(' ·')[0] || label.textContent) +
                ' · ' +
                ticks +
                's';
            }
            /* Only warn after long import (sim.js can be large on cold cache). */
            if (ticks >= 45 && phase === 'import-app') {
              clearInterval(timer);
              if (title && title.dataset.locked !== '1') {
                title.textContent = 'Import slow';
              }
              if (label) {
                label.textContent =
                  'app.js/sim still loading after 45s — check Network for red JS, then Ctrl+Shift+R';
              }
              console.error('[TheDDOS] slow import-app after 45s');
            }
            return;
          }
          /* main.js never started (script tag failed). */
          if (ticks >= 8 && (phase === 'html' || !phase)) {
            clearInterval(timer);
            if (title) title.textContent = 'Entry missing';
            if (label) {
              label.textContent =
                'js/main.js did not run — open via play-local.bat HTTP, Disable cache, Ctrl+Shift+R';
            }
            console.error('[TheDDOS] main.js never set __theDdosPhase');
          }
        }, 1000);
      })();
    </script>
    <script type="module" src="js/main.js?v=20261020a"></script>
  </body>
</html>
