<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TheDDOS Game</title>
    <meta name="description" content="Tactical base defense survival game featuring hierarchical grid maps, wave defense, crafting, and multi-tier AI." />
    <meta property="og:title" content="TheDDOS Game" />
    <meta property="og:description" content="Tactical base defense survival game featuring hierarchical grid maps, wave defense, crafting, and multi-tier AI." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="Asset/AssetSVG/favicon.svg" />
    <link rel="stylesheet" href="/css/main.css" />
    <script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
    <script src="/Design/MainMenu.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- MENU (shown after boot preload) — MainMenu.svg + thin HTML overlays -->
      <section id="screen-menu" class="screen" hidden aria-label="Menu">
        <div id="main-menu-mount" class="main-menu-mount" aria-hidden="false"></div>
        <div class="main-menu-overlays" aria-label="Menu inputs">
          <input
            type="text"
            id="menu-name-input"
            class="menu-overlay-input menu-name-input"
            maxlength="24"
            placeholder="YOUR NAME"
            autocomplete="nickname"
          />
          <input
            type="text"
            id="menu-room-input"
            class="menu-overlay-input menu-room-input"
            maxlength="8"
            inputmode="numeric"
            placeholder="1234567"
            hidden
          />
          <input
            type="text"
            id="menu-join-input"
            class="menu-overlay-input menu-join-input"
            maxlength="32"
            placeholder="Input"
            hidden
          />
        </div>
        <!-- Legacy hooks kept for app.js / boot (hidden — SVG drives UX) -->
        <div class="menu-legacy" hidden aria-hidden="true">
          <select id="sel-mode">
            <option value="FLAT_SURVIVAL">Flat</option>
            <option value="WORLD_TYPE">World Type</option>
          </select>
          <code id="room-code">------</code>
          <button type="button" id="btn-join">Join</button>
          <p id="join-stub"></p>
          <button type="button" id="btn-start">Start</button>
          <button type="button" id="btn-restore">Restore</button>
          <button type="button" id="btn-clear-snap">Clear Snapshot</button>
          <p id="snap-status"></p>
          <div id="save-drop-zone" tabindex="-1">
            <input type="file" id="save-file-input" accept="application/json,.json" />
          </div>
          <p id="save-file-status"></p>
        </div>
      </section>

      <!-- Loading UI = HTML/CSS (SVG files = art reference only) -->
      <section id="screen-loading" class="screen is-active" aria-label="Loading">
        <div id="loading-main" class="loading-view loading-view--main" aria-label="Boot loading">
          <div class="bg-overlay"></div>
          <div class="loading-content">
            <!-- Brand Logo SVG Extracted Directly from Mockup -->
            <div class="brand-logo" id="loading-main-title">
              <svg viewBox="0 0 320 47" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M 77.40 0.70 L 68.40 0.70 L 68.40 18.30 L 50.60 18.30 L 50.60 0.70 L 41.60 0.70 L 41.60 45.50 L 50.60 45.50 L 50.60 25.90 L 68.40 25.90 L 68.40 45.50 L 77.40 45.50 L 77.40 0.70 Z M 95.80 8.30 L 120.10 8.30 L 120.10 0.70 L 86.80 0.70 L 86.80 45.50 L 120.90 45.50 L 120.90 38.00 L 95.80 38.00 L 95.80 25.70 L 118.40 25.70 L 118.40 18.20 L 95.80 18.20 L 95.80 8.30 Z M 0.00 0.70 L 0.00 8.30 L 13.30 8.30 L 13.30 45.50 L 22.40 45.50 L 22.40 8.30 L 35.70 8.30 L 35.70 0.70 L 0.00 0.70 Z M 219.10 2.60 C 216.20 1.30, 212.40 0.70, 207.80 0.70 L 191.20 0.70 L 191.20 45.50 L 208.20 45.50 C 222.00 45.50, 228.80 38.20, 228.80 23.50 C 228.80 18.10, 227.90 13.60, 226.10 9.90 C 224.40 6.30, 222.00 3.90, 219.10 2.60 Z M 200.30 8.30 L 204.30 8.30 C 208.60 8.30, 211.70 8.60, 213.40 9.20 C 215.20 9.80, 216.60 11.20, 217.80 13.30 C 218.90 15.50, 219.40 18.70, 219.40 23.10 C 219.40 29.00, 218.50 33.00, 216.70 35.00 C 214.90 37.00, 211.70 38.00, 207.00 38.00 L 200.30 38.00 L 200.30 8.30 Z M 173.90 2.60 C 171.00 1.30, 167.20 0.70, 162.50 0.70 L 146.00 0.70 L 146.00 45.50 L 163.00 45.50 C 176.70 45.50, 183.60 38.20, 183.60 23.50 C 183.60 18.10, 182.70 13.60, 180.90 9.90 C 179.10 6.30, 176.80 3.90, 173.90 2.60 Z M 168.20 9.20 C 169.90 9.80, 171.40 11.20, 172.50 13.30 C 173.60 15.50, 174.20 18.70, 174.20 23.10 C 174.20 29.00, 173.30 33.00, 171.50 35.00 C 169.60 37.00, 166.40 38.00, 161.80 38.00 L 155.00 38.00 L 155.00 8.30 L 159.10 8.30 C 163.40 8.30, 166.40 8.60, 168.20 9.20 Z M 300.90 0.00 C 296.00 0.00, 292.10 1.10, 289.10 3.20 C 286.10 5.40, 284.60 8.50, 284.60 12.50 C 284.60 19.00, 289.40 23.50, 298.90 25.90 C 304.00 27.20, 307.20 28.20, 308.40 29.00 C 309.70 29.80, 310.30 31.00, 310.30 32.50 C 310.30 36.60, 307.40 38.70, 301.50 38.70 C 296.00 38.70, 292.80 35.80, 291.70 30.10 L 282.90 30.90 C 284.20 41.20, 290.30 46.30, 301.40 46.30 C 313.40 46.30, 319.40 41.70, 319.40 32.40 C 319.40 29.30, 318.50 26.50, 316.90 24.20 C 315.10 21.80, 310.50 19.70, 303.00 17.70 C 298.               </svg>
            </div>

            <!-- Status Info (TipText & Loading Status) -->
            <div class="status-info">
              <span class="tip-text" id="tipText">No_Step_back.You</span>
              <span class="loading-status" id="loadingStatus">Loading 0%</span>
            </div>

            <!-- Sci-Fi Style Loading Bar Container -->
            <div class="loading-bar-wrapper">
              <!-- SVG Border Frame (ArtEdge Frame) -->
              <svg class="loading-frame" viewBox="0 0 626 47" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                <path d="M 625.80 46.90 L 625.80 0.00 L 0.00 0.00 L 0.00 46.90 L 625.80 46.90 Z M 619.80 6.00 L 619.80 40.90 L 6.00 40.90 L 6.00 6.00 L 619.80 6.00 Z" fill="#FF2F14"/>
              </svg>

              <!-- Inner Fill Progress Bar -->
              <div class="fill-track">
                <div class="fill-progress" id="loading-main-fill"></div>
              </div>
            </div>

            <!-- Status Error message container -->
            <p id="loading-main-status" class="loading-view__status" hidden></p>
          </div>
        </div>
        <div id="loading-gameplay" class="loading-view loading-view--gameplay" hidden aria-label="Match loading">
          <div class="loading-gp">
            <h1 id="loading-gp-map" class="loading-gp__map">NAMEMAP</h1>
            <div class="loading-gp__mid">
              <div class="loading-gp__left">
                <div id="loading-gp-mapicon" class="loading-gp__mapicon" aria-hidden="true"></div>
              </div>
              <div class="loading-gp__center">
                <p id="loading-gp-mode" class="loading-gp__mode">MODE:</p>
              </div>
              <div class="loading-gp__col">
                <h2 class="loading-gp__heading">Enemy Team</h2>
                <ul id="loading-gp-enemies" class="loading-gp__list"></ul>
              </div>
              <div class="loading-gp__col">
                <h2 class="loading-gp__heading">Player Team</h2>
                <ul id="loading-gp-players" class="loading-gp__list"></ul>
              </div>
            </div>
            <div class="loading-gp__bar-wrap">
              <div class="loading-bar loading-bar--gp" role="progressbar" aria-valuemin="0" aria-valuemax="100">
                <div id="loading-gp-fill" class="loading-bar__fill"></div>
              </div>
              <p id="loading-gp-status" class="loading-view__status" hidden></p>
              <p id="loading-gp-ready" class="loading-gp__ready" hidden>Click or tap anywhere to start</p>
            </div>
          </div>
        </div>
        <!-- Hidden legacy progress nodes. Errors stay on the visible loading view. -->
        <div id="loading-boot-panel" class="loading-panel" hidden>
          <h2 id="loading-title">Boot failed</h2>
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <p id="progress-label">0% — Starting…</p>
        </div>
      </section>

      <!-- PLAYING — HUD/craft/gen/end = SVG PlayerUI only -->
      <section id="screen-playing" class="screen" hidden aria-label="Playing">
        <div class="canvas-wrap">
          <canvas id="game-canvas" width="800" height="600"></canvas>
        </div>
        <div id="player-ui-mount" class="player-ui-mount" aria-hidden="false"></div>
        <div class="play-debug-tray">
          <button type="button" id="btn-cheat" class="btn btn-ghost" title="Open cheat panel">Cheat</button>
        </div>
        <pre id="play-perf-debug" class="play-perf-debug" hidden>frame —</pre>
        <div id="panel-cheat" class="game-panel" hidden aria-label="Cheat">
          <div class="game-panel-card game-panel-card--cheat">
            <header class="game-panel-head">
              <h2>Cheat</h2>
              <button type="button" id="cheat-close" class="btn btn-ghost panel-x" aria-label="Close">×</button>
            </header>
            <div class="cheat-row">
              <button type="button" id="btn-force-win" class="btn">Force Win (F9)</button>
              <button type="button" id="btn-force-lose" class="btn btn-ghost">Force Lose (F10)</button>
            </div>
            <div class="cheat-row">
              <button type="button" id="btn-free-craft" class="btn btn-ghost" title="Skip craft costs this session">FreeCraft</button>
              <button type="button" id="btn-manual-save" class="btn btn-ghost" title="Export snapshot JSON (not autosave)">Save file</button>
            </div>
            <div class="cheat-zoom">
              <label for="cheat-zoom-range">Camera zoom</label>
              <div class="cheat-zoom-controls">
                <button type="button" id="cheat-zoom-out" class="btn btn-ghost" aria-label="Zoom out">−</button>
                <input type="range" id="cheat-zoom-range" min="0.25" max="2" step="0.1" value="1" />
                <button type="button" id="cheat-zoom-in" class="btn btn-ghost" aria-label="Zoom in">+</button>
                <span id="cheat-zoom-value" class="cheat-zoom-value">1.0</span>
              </div>
              <p class="panel-hint">Scroll on slider · step 0.1 · range 0.25–2.0</p>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      /* Stage UI + soft watchdog — never overwrite Boot failed / locked title. */
      (function () {
        var label = document.getElementById('progress-label');
        var fill = document.getElementById('progress-fill');
        var title = document.getElementById('loading-title');
        if (label) label.textContent = '1% — Starting entry…';
        if (fill) fill.style.width = '1%';
        window.__theDdosPhase = window.__theDdosPhase || 'html';

        var ticks = 0;
        var timer = setInterval(function () {
          var phase = window.__theDdosPhase || '';
          if (window.__theDdos && phase === 'ready') {
            clearInterval(timer);
            return;
          }
          if (phase === 'failed' || phase === 'ready') {
            clearInterval(timer);
            return;
          }
          if (title && title.dataset.locked === '1') {
            clearInterval(timer);
            return;
          }
          ticks += 1;
          /* Still importing heavy graph — show phase, do not hard-fail yet. */
          if (phase === 'import-app' || phase === 'create-app' || phase === 'boot') {
            if (label && ticks % 2 === 0) {
              label.textContent =
                (label.textContent.split(' ·')[0] || label.textContent) +
                ' · ' +
                ticks +
                's';
            }
            /* Only warn after long import (sim.js can be large on cold cache). */
              if (ticks >= 45 && phase === 'import-app') {
              clearInterval(timer);
              var status = document.getElementById('loading-main-status');
              if (status) {
                status.hidden = false;
                status.textContent =
                  'app.js/sim still loading after 45s — check Network for red JS, then Ctrl+Shift+R';
              }
              console.error('[TheDDOS] slow import-app after 45s');
            }
            return;
          }
          /* main.js never started (script tag failed). */
          if (ticks >= 8 && (phase === 'html' || !phase)) {
            clearInterval(timer);
            var missing = document.getElementById('loading-main-status');
            if (missing) {
              missing.hidden = false;
              missing.textContent =
                'js/main.js did not run — open via play-local.bat HTTP, Disable cache, Ctrl+Shift+R';
            }
            console.error('[TheDDOS] main.js never set __theDdosPhase');
          }
        }, 1000);
      })();
    </script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
